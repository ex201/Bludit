services:
  webserver:
    image: nginx:alpine
    container_name: bludit_nginx
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./web/:/var/www/html/
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bludit_php
    restart: unless-stopped
    volumes:
      - ./web/:/var/www/html/
